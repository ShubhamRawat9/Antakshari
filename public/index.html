<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Word Antakshri - a fun word-chain game.">
    <title>Word Antakshri</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main id="game-container">
        <div class="badge">Word Chain Game</div>
        <h1>Word Antakshri</h1>
        <p class="instruction">Make a word that starts with the last letter of the current word.</p>

        <section class="word-card" aria-live="polite">
            <span class="label">Current word</span>
            <strong id="current-word">Loading...</strong>
        </section>

        <label for="word-input">Your word</label>
        <div class="input-row">
            <input type="text" id="word-input" placeholder="Enter your word" autocomplete="off" spellcheck="false">
            <button id="submit-word" type="button">Submit</button>
        </div>

        <p id="message" role="status">Starting game...</p>

        <div class="score-box">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>
    </main>
</body>
</html>
